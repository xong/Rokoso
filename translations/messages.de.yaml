    export_intro: Du erhältst eine JSON-Datei mit deinem Profil, deinen Mitgliedschaften und allem, was du selbst geschrieben hast (Nachrichten, Beiträge, Kommentare, Termine, Entwürfe), sowie deinem Sicherheitsprotokoll.
