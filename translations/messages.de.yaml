two_factor:
    title: Zwei-Faktor-Anmeldung
    intro: Zusätzlich zum Passwort fragt Rokoso bei der Anmeldung einen sechsstelligen Code aus einer Authenticator-App ab (z. B. Aegis, FreeOTP, Google Authenticator). So bleibt dein Konto geschützt, auch wenn jemand dein Passwort kennt.
    active: Die Zwei-Faktor-Anmeldung ist eingeschaltet.
    setup: Zwei-Faktor-Anmeldung einrichten
    step_app: Installiere eine Authenticator-App auf deinem Smartphone.
    step_scan: Scanne den QR-Code mit der App oder gib den Schlüssel von Hand ein.
    step_code: Gib den Code ein, den die App anzeigt.
    qr_alt: QR-Code zum Einrichten der Authenticator-App
    manual: 'Schlüssel zur manuellen Eingabe:'
    code: Code aus der App
    activate: Einschalten
    wrong_code: Der Code stimmt nicht. Prüfe die Uhrzeit deines Smartphones und versuche es erneut.
    enabled: Die Zwei-Faktor-Anmeldung ist eingeschaltet. Bewahre die Ersatzcodes gut auf.
    disabled: Die Zwei-Faktor-Anmeldung ist ausgeschaltet.
    disable: Zwei-Faktor-Anmeldung ausschalten
    codes_title: Deine Ersatzcodes
    codes_hint: Jeder Code funktioniert einmal, falls du dein Smartphone nicht zur Hand hast. Die Codes werden nur jetzt angezeigt – drucke sie aus oder speichere sie in deinem Passwortmanager.
    codes_left: '{0} Du hast keine Ersatzcodes mehr.|{1} Du hast noch einen Ersatzcode.|]1,Inf[ Du hast noch %count% Ersatzcodes.'
    renew_codes: Neue Ersatzcodes erzeugen
    renew_confirm: Die bisherigen Ersatzcodes werden ungültig. Fortfahren?

