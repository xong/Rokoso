    delete_title: Konto löschen
    delete_intro: Deine persönlichen Daten, Mitgliedschaften, Entwürfe, Merkliste und Benachrichtigungen werden gelöscht. Beiträge in gemeinsamen Bereichen (Forum, Protokolle, Beschlüsse) bleiben erhalten und erscheinen unter „Gelöschtes Konto“.
