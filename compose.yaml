# Lokale Entwicklungsdienste: `docker compose up -d`
name: koopio
services:
  database:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: koopio
      MARIADB_USER: koopio
      MARIADB_PASSWORD: koopio
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3307:3306" # 3307, damit es nicht mit XAMPP-MariaDB kollidiert
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 10
    volumes:
      - database_data:/var/lib/mysql
      - ./docker/mariadb:/docker-entrypoint-initdb.d:ro

  mailer:
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Weboberfläche: http://localhost:8025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Test-Postfach mit IMAP + SMTP für die E-Mail-Konten (beliebiger Benutzer/Passwort wird angelegt)
  imap:
    image: greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled"
    ports:
      - "3025:3025" # SMTP
      - "3143:3143" # IMAP

volumes:
  database_data:
